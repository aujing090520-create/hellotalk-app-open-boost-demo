<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HelloTalk · 开屏推荐 Demo</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css?v=placement-group-v7" />
  </head>
  <body>
    <main class="workbench">
      <section class="demo-stage" aria-label="开屏推荐 Demo">
        <div class="phone-shell">
          <div class="phone" id="phone">
            <div class="app" id="app" aria-live="polite"></div>
          </div>
        </div>
      </section>
      <aside class="control-panel admin-console" id="controlPanel">
        <div class="backend-console" id="backendConsole" aria-label="开屏推荐运营后台"></div>
        <section class="demo-tools" aria-label="Demo 状态控制台">
          <div class="demo-tools-head"><strong>Demo 状态控制台</strong><span id="demoStateText" aria-live="polite">进行中：无 · 回访通知：未显示</span></div>
          <p>当前会话状态；仅用于切换客户端演示，不影响运营后台配置。</p>
          <div class="demo-tools-actions">
            <button class="control-action" data-control="create-random">模拟随机投放中</button>
            <button class="control-action" data-control="create-designated">模拟指定投放中</button>
            <button class="control-action" data-control="finish-latest">结束最新任务</button>
            <button class="control-action" data-control="show-completion">查看回访通知</button>
            <button class="control-action is-quiet" data-control="clear-completion">清除回访通知</button>
          </div>
          <div class="demo-tools-completion" aria-label="结束状态预览">
            <strong>结束状态预览</strong>
            <div class="demo-tools-actions">
              <button class="control-action" data-control="completion-random-complete">随机：套餐完成</button>
              <button class="control-action" data-control="completion-random-partial">随机：未完整展示</button>
              <button class="control-action" data-control="completion-designated-shown">指定：已展示</button>
              <button class="control-action" data-control="completion-designated-unshown">指定：未展示</button>
            </div>
          </div>
        </section>
        <div class="review-control">
          <label class="switch-row">
            <span>评审映射</span>
            <input id="reviewToggle" type="checkbox" />
            <i></i>
          </label>
          <p>显示 FR 编号、规则卡和页面连线。</p>
        </div>
        <div id="rulePanel" class="rule-panel" hidden></div>
      </aside>
    </main>
    <svg id="connectorLayer" class="connector-layer" aria-hidden="true"></svg>
    <script src="app.js?v=placement-group-v7"></script>
  </body>
</html>
