<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HelloTalk · 开屏推荐 Demo</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css?v=placement-group-v7" />
  </head>
  <body>
    <main class="workbench">
      <section class="demo-stage" aria-label="开屏推荐 Demo">
        <div class="phone-shell">
          <div class="phone" id="phone">
            <div class="app" id="app" aria-live="polite"></div>
          </div>
        </div>
      </section>
      <aside class="control-panel admin-console" id="controlPanel">
        <div class="backend-console" id="backendConsole" aria-label="开屏推荐运营后台"></div>
        <section class="demo-tools">
          <p>客户端演示辅助</p>
          <div class="control-segment" role="group" aria-label="体验身份">
            <button class="control-choice is-active" data-control="plus">Plus 用户</button>
            <button class="control-choice" data-control="normal">普通用户</button>
          </div>
          <div class="demo-tools-actions"><button class="control-action" data-control="create-random">模拟随机投放中</button><button class="control-action" data-control="create-designated">模拟指定投放中</button><button class="control-action" data-control="finish-latest">结束最新任务</button></div>
        </section>
        <div class="review-control">
          <label class="switch-row">
            <span>评审映射</span>
            <input id="reviewToggle" type="checkbox" />
            <i></i>
          </label>
          <p>显示 FR 编号、规则卡和页面连线。</p>
        </div>
        <div id="rulePanel" class="rule-panel" hidden></div>
      </aside>
    </main>
    <svg id="connectorLayer" class="connector-layer" aria-hidden="true"></svg>
    <script src="app.js?v=placement-group-v7"></script>
  </body>
</html>
